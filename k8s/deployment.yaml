apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd
  namespace: lens-spark
  labels:
    app: httpd
spec:
  replicas: 1
  # Recreate: site-content and site-logs are RWO; a rolling update would deadlock on the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd
    spec:
      restartPolicy: Always
      serviceAccountName: httpd
      containers:
        - name: httpd
          # sclorg-style image: runs as arbitrary UID under the restricted
          # SCC, listens on 8080, serves /var/www/html.
          image: registry.redhat.io/ubi9/httpd-24:1
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # tcpSocket, not httpGet: the PVC starts empty (content is copied
          # in after first deploy).
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: content
              mountPath: /var/www/html
            - name: remoteip
              mountPath: /etc/httpd/conf.d/remoteip.conf
              subPath: remoteip.conf
              readOnly: true
            - name: cache
              mountPath: /etc/httpd/conf.d/cache.conf
              subPath: cache.conf
              readOnly: true
            - name: logs
              mountPath: /var/log/lens-spark
            - name: accesslog
              mountPath: /etc/httpd/conf.d/accesslog.conf
              subPath: accesslog.conf
              readOnly: true
            - name: accesslog
              mountPath: /opt/lens-spark/hashlog.sh
              subPath: hashlog.sh
              readOnly: true
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: site-content
        - name: remoteip
          configMap:
            name: httpd-remoteip
        - name: cache
          configMap:
            name: httpd-cache
        - name: logs
          persistentVolumeClaim:
            claimName: site-logs
        - name: accesslog
          configMap:
            name: httpd-accesslog
            defaultMode: 0555
