# TLS terminates at the router with the Let's Encrypt certificate issued by
# certificate.yaml (cut over 2026-10-15). cert-manager renews the secret; the
# router picks up renewals via externalCertificate.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: lens-spark
  namespace: lens-spark
  labels:
    app: httpd
spec:
  host: lens-spark.dharmabruce.com
  to:
    kind: Service
    name: httpd
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    externalCertificate:
      name: lens-spark-tls
